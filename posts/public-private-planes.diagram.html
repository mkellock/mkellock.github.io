<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#0f0f0f}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="2400" height="1260">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4b4b4"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffe600"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a4e"/></marker>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;text-transform:uppercase}
      .sans{font-family:Inter,'Helvetica Neue',Arial,sans-serif}
      .node{fill:#1a1a1a;stroke:#6a6a6a;stroke-width:1.5}
      .zone{fill:#141414;stroke:#4a4a4a;stroke-width:1.5;stroke-dasharray:6 5}
      .nt{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:600;fill:#f0f0f0}
      .zl{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:11px;letter-spacing:1.4px;fill:#8f8f8f}
      .al{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:11px;letter-spacing:1.2px}
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0f0f0f"/>

  <!-- Header -->
  <text x="48" y="60" class="mono" font-size="15" letter-spacing="2.2" fill="#ffe600">PUBLIC BY DESIGN · PRIVATE BY DEFAULT</text>
  <text x="1152" y="60" class="mono" font-size="13" letter-spacing="2" fill="#8f8f8f" text-anchor="end">KELLOCK.COM.AU</text>
  <rect x="48" y="80" width="1104" height="2" fill="#f0f0f0"/>

  <!-- ===== BEFORE ===== -->
  <rect x="48" y="106" width="528" height="452" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="76" y="146" class="mono" font-size="13" letter-spacing="2" fill="#8f8f8f">01 · BEFORE</text>
  <text x="76" y="182" class="sans" font-size="27" font-weight="800" letter-spacing="-0.6" fill="#f0f0f0">The public tier reaches inside</text>

  <rect x="76" y="218" width="190" height="50" class="node"/>
  <text x="171" y="249" class="nt" text-anchor="middle">Internet &amp; agents</text>
  <line x1="171" y1="268" x2="171" y2="326" stroke="#b4b4b4" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="76" y="330" width="190" height="56" class="node"/>
  <text x="171" y="364" class="nt" text-anchor="middle">Public portal</text>

  <rect x="322" y="300" width="226" height="230" class="zone"/>
  <text x="338" y="516" class="zl">INTERNAL NETWORK</text>

  <rect x="338" y="334" width="194" height="48" class="node"/>
  <text x="435" y="364" class="nt" text-anchor="middle">Non-public data</text>
  <rect x="338" y="424" width="194" height="48" class="node"/>
  <text x="435" y="454" class="nt" text-anchor="middle">Internal server</text>

  <line x1="266" y1="352" x2="334" y2="352" stroke="#b4b4b4" stroke-width="2" marker-end="url(#aw)"/>
  <text x="298" y="342" class="al" fill="#b4b4b4" text-anchor="middle">READS</text>
  <line x1="266" y1="380" x2="335" y2="438" stroke="#ff5a4e" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="280" y="428" class="al" fill="#ff5a4e" text-anchor="middle">WRITES</text>

  <!-- ===== AFTER ===== -->
  <rect x="624" y="106" width="528" height="452" fill="#0f0f0f" stroke="#ffe600" stroke-width="1.5"/>
  <text x="652" y="146" class="mono" font-size="13" letter-spacing="2" fill="#ffe600">02 · AFTER</text>
  <text x="652" y="182" class="sans" font-size="27" font-weight="800" letter-spacing="-0.6" fill="#f0f0f0">Separate public and private planes</text>

  <!-- public plane -->
  <rect x="652" y="300" width="206" height="230" class="zone"/>
  <text x="668" y="516" class="zl">PUBLIC PLANE</text>
  <rect x="660" y="218" width="190" height="50" class="node"/>
  <text x="755" y="249" class="nt" text-anchor="middle">Internet &amp; agents</text>
  <line x1="755" y1="268" x2="755" y2="312" stroke="#b4b4b4" stroke-width="2" marker-end="url(#aw)"/>
  <rect x="668" y="316" width="174" height="60" class="node"/>
  <text x="755" y="342" class="nt" text-anchor="middle">Public portal</text>
  <text x="755" y="362" class="al" fill="#8f8f8f" text-anchor="middle">READ-ONLY</text>
  <line x1="755" y1="376" x2="755" y2="420" stroke="#b4b4b4" stroke-width="2" marker-end="url(#aw)"/>
  <text x="763" y="402" class="al" fill="#b4b4b4">QUERIES</text>
  <rect x="668" y="424" width="174" height="48" fill="rgba(255,230,0,0.1)" stroke="#ffe600" stroke-width="1.8"/>
  <text x="755" y="454" class="nt" text-anchor="middle" fill="#ffe600" style="fill:#ffe600">Released data only</text>

  <!-- private plane -->
  <rect x="926" y="300" width="198" height="230" class="zone"/>
  <text x="942" y="516" class="zl">PRIVATE PLANE</text>
  <rect x="930" y="218" width="190" height="50" class="node"/>
  <text x="1025" y="249" class="nt" text-anchor="middle">Staff via gateway</text>
  <line x1="1025" y1="268" x2="1025" y2="330" stroke="#b4b4b4" stroke-width="2" marker-end="url(#aw)"/>
  <rect x="938" y="334" width="174" height="48" class="node"/>
  <text x="1025" y="364" class="nt" text-anchor="middle">Non-public data</text>
  <rect x="938" y="424" width="174" height="48" class="node"/>
  <text x="1025" y="454" class="nt" text-anchor="middle">Internal server</text>

  <!-- no route in -->
  <g stroke="#8f8f8f" stroke-width="2.2" stroke-linecap="square">
    <line x1="884" y1="338" x2="900" y2="354"/><line x1="900" y1="338" x2="884" y2="354"/>
  </g>
  <text x="892" y="376" class="al" fill="#8f8f8f" text-anchor="middle" font-size="10">NO</text>
  <text x="892" y="389" class="al" fill="#8f8f8f" text-anchor="middle" font-size="10">ROUTE</text>

  <!-- one-way push -->
  <line x1="938" y1="448" x2="846" y2="448" stroke="#ffe600" stroke-width="2.4" marker-end="url(#ay)"/>
  <text x="892" y="436" class="al" fill="#ffe600" text-anchor="middle" font-size="10">ONE-WAY</text>
  <text x="892" y="468" class="al" fill="#ffe600" text-anchor="middle" font-size="10">PUSH</text>

  <!-- Captions -->
  <text x="48" y="596" class="sans" font-size="17" fill="#b4b4b4">Only the application's own checks stand in the way.</text>
  <text x="624" y="596" class="sans" font-size="17" fill="#b4b4b4">The public tier can only see what was released.</text>
</svg>
</body></html>
