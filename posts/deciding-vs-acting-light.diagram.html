<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#f4f4f1}svg{display:block}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="2400" height="1260">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e5f00"/></marker>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;text-transform:uppercase}
      .sans{font-family:Inter,'Helvetica Neue',Arial,sans-serif}
      .node{fill:#eaeae5;stroke:#7a7a72;stroke-width:1.5}
      .nt{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:600;fill:#0f0f0f}
      .ns{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#333333}
      .al{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:15px;letter-spacing:1.2px}
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f4f4f1"/>

  <text x="48" y="60" class="mono" font-size="17" letter-spacing="2.2" fill="#6e5f00">DECISION MODELS · DECIDE FIRST, THEN ACT</text>
  <text x="1152" y="60" class="mono" font-size="15" letter-spacing="2" fill="#595959" text-anchor="end">KELLOCK.COM.AU</text>
  <rect x="48" y="80" width="1104" height="2" fill="#0f0f0f"/>

  <!-- BEFORE -->
  <rect x="48" y="106" width="528" height="452" fill="#f4f4f1" stroke="#7a7a72" stroke-width="1.5"/>
  <text x="76" y="146" class="mono" font-size="15" letter-spacing="2" fill="#595959">01 · BEFORE</text>
  <text x="76" y="184" class="sans" font-size="28" font-weight="800" letter-spacing="-0.6" fill="#0f0f0f">One agent decides and acts</text>

  <rect x="152" y="214" width="320" height="48" class="node"/>
  <text x="312" y="245" class="nt" text-anchor="middle">Each message</text>
  <line x1="312" y1="262" x2="312" y2="292" stroke="#333333" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="152" y="296" width="320" height="104" class="node" style="stroke:#c62828;stroke-width:2.4"/>
  <text x="312" y="330" class="nt" text-anchor="middle">Agent with tools</text>
  <text x="312" y="358" class="ns" text-anchor="middle">decides what each message is</text>
  <text x="312" y="382" class="ns" text-anchor="middle">and whether to act on it</text>
  <text x="312" y="426" class="al" fill="#c62828" text-anchor="middle">RULES LIVE ONLY IN THE PROMPT</text>
  <line x1="312" y1="436" x2="312" y2="474" stroke="#333333" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="152" y="478" width="320" height="48" class="node"/>
  <text x="312" y="509" class="nt" text-anchor="middle">Actions on mail and tasks</text>

  <!-- AFTER -->
  <rect x="624" y="106" width="528" height="452" fill="#f4f4f1" stroke="#6e5f00" stroke-width="1.5"/>
  <text x="652" y="146" class="mono" font-size="15" letter-spacing="2" fill="#6e5f00">02 · AFTER</text>
  <text x="652" y="184" class="sans" font-size="28" font-weight="800" letter-spacing="-0.6" fill="#0f0f0f">Decide first, then act</text>

  <rect x="652" y="214" width="236" height="48" class="node"/>
  <text x="770" y="245" class="nt" text-anchor="middle">Each message</text>
  <line x1="770" y1="262" x2="770" y2="288" stroke="#333333" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="652" y="292" width="236" height="48" fill="#ffe600"/>
  <text x="770" y="323" class="nt" text-anchor="middle" style="fill:#0f0f0f">Decision model</text>
  <text x="912" y="312" class="ns" style="fill:#333333">Typed answers,</text>
  <text x="912" y="334" class="ns" style="fill:#333333">a probability each</text>
  <line x1="770" y1="340" x2="770" y2="366" stroke="#333333" stroke-width="2" marker-end="url(#aw)"/>

  <rect x="652" y="370" width="236" height="48" class="node"/>
  <text x="770" y="401" class="nt" text-anchor="middle">Code: thresholds</text>

  <line x1="888" y1="394" x2="944" y2="394" stroke="#6e5f00" stroke-width="2.4" marker-end="url(#ay)"/>
  <rect x="948" y="370" width="176" height="48" class="node"/>
  <text x="1036" y="401" class="nt" text-anchor="middle">Code acts</text>
  <text x="1036" y="446" class="al" fill="#6e5f00" text-anchor="middle">IF CONFIDENT</text>

  <line x1="770" y1="418" x2="770" y2="474" stroke="#333333" stroke-width="2" marker-end="url(#aw)"/>
  <text x="786" y="452" class="al" fill="#333333">THE REST</text>
  <rect x="652" y="478" width="236" height="48" class="node"/>
  <text x="770" y="509" class="nt" text-anchor="middle">Agent with tools</text>

  <text x="48" y="598" class="sans" font-size="18" fill="#333333">The rule against acting rests on each judgement.</text>
  <text x="624" y="598" class="sans" font-size="18" fill="#333333">Code acts before the agent sees anything.</text>
</svg>
</body></html>
