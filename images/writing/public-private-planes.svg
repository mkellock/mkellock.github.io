<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Before and after: separating public and private planes</title>
  <desc id="d">Before: a public portal reachable from the internet reads non-public data and can write to an internal server, with only application checks in between. After: the public portal is read-only and queries a store holding only released data; internal systems push releases to that store one way; there is no route from the portal into the private plane, and staff reach it through an access gateway.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44403c"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- Panel titles -->
  <text x="40" y="38" font-size="17" font-weight="700" fill="#1c1917">Before</text>
  <text x="40" y="58" font-size="13" fill="#57534e">The public tier reaches internal systems</text>
  <text x="510" y="38" font-size="17" font-weight="700" fill="#1c1917">After</text>
  <text x="510" y="58" font-size="13" fill="#57534e">Separate public and private planes</text>

  <!-- Divider -->
  <line x1="475" y1="24" x2="475" y2="430" stroke="#e7e5e4" stroke-width="2"/>

  <!-- ===== BEFORE ===== -->
  <rect x="40" y="75" width="140" height="44" rx="8" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <text x="110" y="102" font-size="14" text-anchor="middle" fill="#1c1917">Internet &amp; agents</text>

  <rect x="40" y="195" width="140" height="54" rx="8" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <text x="110" y="227" font-size="14" text-anchor="middle" fill="#1c1917">Public portal</text>

  <line x1="110" y1="119" x2="110" y2="192" stroke="#44403c" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="250" y="150" width="190" height="240" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="262" y="380" font-size="12" font-weight="600" fill="#57534e">Internal network</text>

  <rect x="265" y="195" width="160" height="44" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="345" y="222" font-size="14" text-anchor="middle" fill="#1c1917">Non-public data</text>

  <rect x="265" y="310" width="160" height="44" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="345" y="337" font-size="14" text-anchor="middle" fill="#1c1917">Internal server</text>

  <line x1="180" y1="217" x2="262" y2="217" stroke="#44403c" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="221" y="208" font-size="12" text-anchor="middle" fill="#44403c">reads</text>

  <line x1="180" y1="242" x2="262" y2="326" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="205" y="300" font-size="12" font-weight="600" text-anchor="middle" fill="#b91c1c">writes</text>

  <text x="40" y="420" font-size="13" fill="#57534e">Only the application's own checks stand in the way.</text>

  <!-- ===== AFTER ===== -->
  <rect x="525" y="75" width="140" height="44" rx="8" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <text x="595" y="102" font-size="14" text-anchor="middle" fill="#1c1917">Internet &amp; agents</text>

  <rect x="510" y="150" width="170" height="240" rx="10" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="522" y="380" font-size="12" font-weight="600" fill="#57534e">Public plane</text>

  <rect x="520" y="195" width="150" height="54" rx="8" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <text x="595" y="218" font-size="14" text-anchor="middle" fill="#1c1917">Public portal</text>
  <text x="595" y="237" font-size="12" text-anchor="middle" fill="#57534e">(read-only)</text>

  <rect x="520" y="310" width="150" height="44" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="595" y="337" font-size="14" text-anchor="middle" fill="#1c1917">Released data only</text>

  <line x1="595" y1="119" x2="595" y2="192" stroke="#44403c" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="595" y1="249" x2="595" y2="307" stroke="#44403c" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="603" y="283" font-size="12" fill="#44403c">queries</text>

  <rect x="750" y="150" width="190" height="240" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="762" y="380" font-size="12" font-weight="600" fill="#57534e">Private plane</text>

  <rect x="765" y="75" width="160" height="44" rx="8" fill="#fafaf9" stroke="#78716c" stroke-width="1.5"/>
  <text x="845" y="102" font-size="14" text-anchor="middle" fill="#1c1917">Staff via gateway</text>
  <line x1="845" y1="119" x2="845" y2="192" stroke="#44403c" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="765" y="195" width="160" height="44" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="845" y="222" font-size="14" text-anchor="middle" fill="#1c1917">Non-public data</text>

  <rect x="765" y="310" width="160" height="44" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.5"/>
  <text x="845" y="337" font-size="14" text-anchor="middle" fill="#1c1917">Internal server</text>

  <!-- No route from public portal into private plane -->
  <text x="715" y="214" font-size="11" text-anchor="middle" fill="#78716c" font-style="italic">no route</text>
  <text x="715" y="228" font-size="11" text-anchor="middle" fill="#78716c" font-style="italic">in</text>

  <!-- One-way push of releases -->
  <line x1="763" y1="332" x2="673" y2="332" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/>
  <text x="715" y="323" font-size="11" text-anchor="middle" fill="#0f766e" font-weight="600">one-way</text>
  <text x="715" y="349" font-size="11" text-anchor="middle" fill="#0f766e" font-weight="600">push</text>

  <text x="510" y="420" font-size="13" fill="#57534e">The public tier can only see what was released.</text>
</svg>
